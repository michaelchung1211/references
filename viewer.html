---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<header>
  <p><a href="{{ '/' | relative_url }}">&larr; back to index</a></p>
  <h1 id="title">Loading&hellip;</h1>
</header>
<main id="content" class="markdown-body">Loading&hellip;</main>

<form id="unlock-form" hidden>
  <p class="muted">This file is encrypted. Enter the password for project <strong id="unlock-project"></strong>.</p>
  <label>
    Password:
    <input id="unlock-pw" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Unlock</button>
  <div id="unlock-error" class="muted" role="alert"></div>
</form>

<script type="module">
  import {
    decryptBlob,
    deriveKey,
    utf8Decode,
    b64ToBytes,
  } from '{{ "/crypto.js" | relative_url }}';

  const BASEURL = {{ site.baseurl | jsonify }};
  const params = new URLSearchParams(location.search);
  const content = document.getElementById('content');
  const titleEl = document.getElementById('title');
  const unlockForm = document.getElementById('unlock-form');
  const unlockProjectEl = document.getElementById('unlock-project');
  const unlockErrorEl = document.getElementById('unlock-error');

  const encBlob = params.get('blob');
  const plainPath = params.get('path');

  if (encBlob) {
    await renderEncrypted(encBlob, params.get('project'), params.get('type'), params.get('name'));
  } else if (plainPath) {
    await renderPlain(plainPath);
  } else {
    content.textContent = 'No path specified.';
    titleEl.textContent = 'Viewer';
  }

  // ---------- plaintext path (unchanged behavior) ----------
  async function renderPlain(path) {
    const prefix = (BASEURL || '') + '/';
    if (path.indexOf(prefix) !== 0 && path.indexOf('/') !== 0) {
      content.textContent = 'Invalid path.';
      return;
    }
    const fileName = path.split('/').pop();
    document.title = fileName;
    titleEl.textContent = fileName;
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      const md = await res.text();
      content.innerHTML = DOMPurify.sanitize(marked.parse(md));
    } catch (e) {
      content.textContent = 'Failed to load: ' + e.message;
    }
  }

  // ---------- encrypted path ----------
  async function renderEncrypted(blobName, projectName, type, name) {
    document.title = name || 'Encrypted';
    titleEl.textContent = name || 'Encrypted file';

    const manifest = await loadManifest();
    if (!manifest) {
      content.textContent = 'Could not load manifest.';
      return;
    }
    const project = manifest.projects.find((p) => p.name === projectName);
    if (!project || !project.private) {
      content.textContent = 'Project not found in manifest, or not private.';
      return;
    }
    const file = project.files.find((f) => f.blob === blobName);
    if (!file) {
      content.textContent = 'File not found in manifest.';
      return;
    }

    let blobBytes;
    try {
      blobBytes = new Uint8Array(
        await (await fetch((BASEURL || '') + '/encrypted/' + blobName)).arrayBuffer()
      );
    } catch (e) {
      content.textContent = 'Failed to fetch blob: ' + e.message;
      return;
    }

    const salt = b64ToBytes(project.salt);
    const sessionKey = 'proj-pw:' + project.name;
    let cachedPw = sessionStorage.getItem(sessionKey);

    while (true) {
      let pw = cachedPw || (await promptForProjectPassword(project.name));
      if (!pw) { content.textContent = 'Cancelled.'; return; }
      content.textContent = 'Decrypting…';
      try {
        const key = await deriveKey(pw, salt);
        const plaintext = await decryptBlob(key, blobBytes);
        sessionStorage.setItem(sessionKey, pw);
        unlockForm.hidden = true;
        renderDecrypted(plaintext, file);
        return;
      } catch (_e) {
        sessionStorage.removeItem(sessionKey);
        cachedPw = null;
        unlockErrorEl.textContent = 'Wrong password — try again.';
      }
    }
  }

  function renderDecrypted(bytes, file) {
    if (file.type === 'md') {
      content.innerHTML = DOMPurify.sanitize(marked.parse(utf8Decode(bytes)));
    } else if (file.type === 'pdf') {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      content.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.style.width = '100%';
      iframe.style.height = '85vh';
      iframe.style.border = '0';
      content.appendChild(iframe);
    } else if (file.type === 'html') {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'text/html' }));
      content.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.setAttribute('sandbox', 'allow-same-origin');
      iframe.style.width = '100%';
      iframe.style.height = '85vh';
      iframe.style.border = '0';
      content.appendChild(iframe);
    } else {
      const url = URL.createObjectURL(new Blob([bytes]));
      content.innerHTML = '';
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      a.textContent = 'Download ' + file.name;
      content.appendChild(a);
    }
  }

  async function loadManifest() {
    try {
      const res = await fetch((BASEURL || '') + '/encrypted/manifest.json');
      if (!res.ok) throw new Error(res.status + '');
      return await res.json();
    } catch { return null; }
  }

  function promptForProjectPassword(project) {
    return new Promise((resolve) => {
      unlockProjectEl.textContent = project;
      unlockForm.hidden = false;
      unlockErrorEl.textContent = '';
      content.textContent = '';
      const submit = (e) => {
        e.preventDefault();
        const pw = document.getElementById('unlock-pw').value;
        unlockForm.removeEventListener('submit', submit);
        resolve(pw);
      };
      unlockForm.addEventListener('submit', submit);
    });
  }
</script>
</body>
</html>
