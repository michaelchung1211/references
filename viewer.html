---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<main id="content" class="markdown-body">Loading…</main>

<form id="unlock-form" class="container" hidden>
  <section class="vault">
    <div class="vault-bar"></div>
    <div class="vault-body">
      <div class="vault-head">
        <div>
          <div class="vault-name" id="unlock-project">Encrypted</div>
          <div class="vault-sub">Enter the project password to view this file.</div>
        </div>
        <span class="vault-pill">Locked</span>
      </div>
      <div class="pw-label">Password</div>
      <div class="pw-row">
        <div class="pw-wrap">
          <input id="unlock-pw" class="pw-input" type="password" placeholder="Enter password…" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="unlock-toggle" aria-label="Show password">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-unlock">Unlock</button>
      </div>
      <div id="unlock-error" class="status-msg" role="alert"></div>
    </div>
  </section>
</form>

<script type="module">
  import {
    decryptBlob,
    deriveKey,
    utf8Decode,
    b64ToBytes,
  } from '{{ "/crypto.js" | relative_url }}';

  const BASEURL = {{ site.baseurl | jsonify }};
  const params = new URLSearchParams(location.search);
  const content = document.getElementById('content');
  const unlockForm = document.getElementById('unlock-form');
  const unlockProjectEl = document.getElementById('unlock-project');
  const unlockErrorEl = document.getElementById('unlock-error');
  const unlockInput = document.getElementById('unlock-pw');
  const unlockToggle = document.getElementById('unlock-toggle');

  // Eye toggle for the password field.
  unlockToggle.addEventListener('click', () => {
    unlockInput.type = unlockInput.type === 'password' ? 'text' : 'password';
  });

  function setUnlockStatus(kind, msg) {
    unlockErrorEl.className = 'status-msg' + (kind ? ' ' + kind : '');
    unlockErrorEl.textContent = msg;
  }

  const encBlob = params.get('blob');
  const plainPath = params.get('path');

  if (encBlob) {
    await renderEncrypted(encBlob, params.get('project'), params.get('type'), params.get('name'));
  } else if (plainPath) {
    await renderPlain(plainPath);
  } else {
    content.textContent = 'No path specified.';
  }

  // ---------- plaintext path (markdown only — HTML/PDF plaintext files
  // are linked directly from index.html, not through the viewer) ----------
  async function renderPlain(path) {
    const prefix = (BASEURL || '') + '/';
    if (path.indexOf(prefix) !== 0 && path.indexOf('/') !== 0) {
      content.textContent = 'Invalid path.';
      return;
    }
    const fileName = path.split('/').pop();
    document.title = fileName;
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      const md = await res.text();
      content.innerHTML = DOMPurify.sanitize(marked.parse(md));
    } catch (e) {
      content.textContent = 'Failed to load: ' + e.message;
    }
  }

  // ---------- encrypted path ----------
  async function renderEncrypted(blobName, projectName, type, name) {
    document.title = name || 'Encrypted';

    const manifest = await loadManifest();
    if (!manifest) {
      content.textContent = 'Could not load manifest.';
      return;
    }
    const project = manifest.projects.find((p) => p.name === projectName);
    if (!project || !project.private) {
      content.textContent = 'Project not found in manifest, or not private.';
      return;
    }
    const file = project.files.find((f) => f.blob === blobName);
    if (!file) {
      content.textContent = 'File not found in manifest.';
      return;
    }

    let blobBytes;
    try {
      blobBytes = new Uint8Array(
        await (await fetch((BASEURL || '') + '/encrypted/' + blobName)).arrayBuffer()
      );
    } catch (e) {
      content.textContent = 'Failed to fetch blob: ' + e.message;
      return;
    }

    const salt = b64ToBytes(project.salt);
    const sessionKey = 'proj-pw:' + project.name;
    let cachedPw = sessionStorage.getItem(sessionKey);

    while (true) {
      let pw = cachedPw || (await promptForProjectPassword(project.title || project.name));
      if (!pw) { content.textContent = 'Cancelled.'; return; }
      content.textContent = 'Decrypting…';
      try {
        const key = await deriveKey(pw, salt);
        const plaintext = await decryptBlob(key, blobBytes);
        sessionStorage.setItem(sessionKey, pw);
        unlockForm.hidden = true;
        renderDecrypted(plaintext, file);
        return;
      } catch (_e) {
        sessionStorage.removeItem(sessionKey);
        cachedPw = null;
        setUnlockStatus('error', 'Incorrect password — try again.');
        unlockInput.classList.remove('error'); void unlockInput.offsetWidth;
        unlockInput.classList.add('error');
        setTimeout(() => unlockInput.classList.remove('error'), 420);
      }
    }
  }

  function renderDecrypted(bytes, file) {
    if (file.type === 'md') {
      // Render markdown directly into the page — the .markdown-body styles in
      // assets/style.css give it max-width 720px and centered typography.
      content.innerHTML = DOMPurify.sanitize(marked.parse(utf8Decode(bytes)));
      return;
    }

    if (file.type === 'pdf' || file.type === 'html') {
      // Hand the browser the decrypted bytes as a blob URL and navigate to
      // it. The browser's built-in PDF viewer / HTML renderer takes over the
      // whole tab — no iframe, no surrounding chrome. location.replace()
      // keeps the history stack clean: one Back returns to the project page.
      const mime = file.type === 'pdf' ? 'application/pdf' : 'text/html';
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      location.replace(url);
      return;
    }

    // Unknown type — offer a download.
    const url = URL.createObjectURL(new Blob([bytes]));
    content.innerHTML = '';
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.textContent = 'Download ' + file.name;
    a.className = 'footer-link';
    content.appendChild(a);
  }

  async function loadManifest() {
    try {
      const res = await fetch((BASEURL || '') + '/encrypted/manifest.json');
      if (!res.ok) throw new Error(res.status + '');
      return await res.json();
    } catch { return null; }
  }

  function promptForProjectPassword(projectLabel) {
    return new Promise((resolve) => {
      unlockProjectEl.textContent = projectLabel;
      unlockForm.hidden = false;
      setUnlockStatus('', '');
      content.textContent = '';
      unlockInput.value = '';
      unlockInput.focus();
      const submit = (e) => {
        e.preventDefault();
        const pw = unlockInput.value;
        unlockForm.removeEventListener('submit', submit);
        resolve(pw);
      };
      unlockForm.addEventListener('submit', submit);
    });
  }
</script>
</body>
</html>
