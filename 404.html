<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script>
    // GitHub Pages serves this file (with HTTP 404) for any unknown path.
    // Hand the requested path to index.html via sessionStorage; the home page
    // restores the URL with history.replaceState and either filters down to
    // the matching project, or shows a "Project not found" notice.
    (function () {
      try {
        sessionStorage.setItem(
          'spa-redirect',
          location.pathname + location.search + location.hash
        );
      } catch (_e) { /* sessionStorage disabled — fall through to plain redirect */ }
      location.replace({{ "/" | relative_url | jsonify }});
    })();
  </script>
</head>
<body>
<div class="container">
  <section class="notice">
    <span class="vault-name">Loading…</span>
    <p>
      If you are not redirected automatically,
      <a href="{{ '/' | relative_url }}">go to the home page</a>.
    </p>
  </section>
</div>
</body>
</html>
